name: Engine files problem
description: A file on the engine site is missing, out of date or fails to load.
labels: [bug]
body:
  - type: input
    id: file
    attributes:
      label: Which file or address
      placeholder: https://zaccesss.github.io/vitafolio-latex/busytex/busytex.wasm
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The error or status you see. Include the browser you used.
    validations:
      required: true
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
